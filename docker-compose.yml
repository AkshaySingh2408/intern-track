version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: interntrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: interntrack
      MYSQL_USER: interntrack_user
      MYSQL_PASSWORD: interntrack_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interntrack-backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpassword@mysql:3306/interntrack?charset=utf8mb4
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: interntrack
      SECRET_KEY: interntrack_super_secure_jwt_secret_key_2026_production
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interntrack-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
