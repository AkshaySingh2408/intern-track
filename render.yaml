services:
  # Backend API Service
  - type: web
    name: interntrack-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: DATABASE_URL
        fromDatabase:
          name: interntrack-mysql
          property: connectionString

databases:
  # Managed MySQL Database
  - name: interntrack-mysql
    databaseName: interntrack
    user: interntrack_user
    plan: free
